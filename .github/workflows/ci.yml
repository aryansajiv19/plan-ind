name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SECURITY_CONTROL_SECRET: ci-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:schema
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test-db:
    # Self-contained: a throwaway local Supabase stack, never the live
    # project. Own job so a slow/flaky local-stack boot never blocks the
    # fast hermetic suite above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start --exclude studio,edge-runtime,imgproxy,logflare,vector,pgbouncer
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/schema.sql
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  test-e2e:
    # ON by default as of 2026-09-07. It used to vote on the LIVE shared plan
    # every run, which is why it was opt-in; tests/e2e/global-setup.ts now
    # provisions a disposable plan against a LOCAL Supabase stack and
    # global-teardown removes it. Setup REFUSES any non-loopback base URL, so
    # a misconfigured run cannot point browsers at production and start
    # voting.
    #
    # Teardown is only real locally, and that is not a convenience: `plans`
    # and `votes` have no delete policy at all (writes go through
    # security-definer RPCs) and there is no service-role key, so nothing in
    # this project can remove a plan or a vote from a hosted project once
    # created. Per-run fixtures against live would have leaked rows into
    # production permanently.
    if: vars.RUN_E2E != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SECURITY_CONTROL_SECRET: ${{ secrets.SECURITY_CONTROL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # webkit and Mobile Safari are deliberately EXCLUDED here, and the
      # headers are deliberately NOT relaxed to include them.
      #
      # The production build sends HSTS plus a CSP carrying
      # upgrade-insecure-requests. WebKit honours both on localhost and
      # rewrites every asset to https://, which fails with an SSL error over
      # plain http; Chromium and Firefox exempt localhost from HSTS, so they
      # do not. That is correct production behaviour on all three -- in
      # production everything is https and the upgrade is a no-op. Weakening
      # the headers to make a test pass would trade a real security control
      # for green CI.
      #
      # So these three run here, and WebKit coverage comes from running the
      # suite against an https preview deployment. Confirmed by WebKit's own
      # requestfailed events, not inferred.
      - run: npx playwright install --with-deps chromium firefox
      - run: npx supabase start
      - run: npm run test:e2e -- --project=chromium --project=firefox --project="Mobile Chrome"
