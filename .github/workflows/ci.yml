name: CI

on:
  pull_request:
  # Every branch: work lands on long-lived non-main branches here, and a
  # main-only trigger let a schema.sql that could not build go unnoticed.
  push:
  # Visual baselines are made here, in CI's own Linux environment, never on a
  # laptop: gh workflow run ci.yml --ref <branch> -f update_visual=true
  workflow_dispatch:
    inputs:
      update_visual:
        description: Regenerate visual baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://example.test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      SECURITY_CONTROL_SECRET: ci-placeholder-secret-at-least-32-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:schema
      # 070 is applied live (frozen) and 075's catalogue block is generated:
      # re-running the generator must change neither.
      - run: node scripts/gen-catalogue-truth.mjs > /dev/null && git diff --exit-code -- supabase/migration-070-catalogue-truth.sql supabase/migration-075-member-booking.sql
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  test-db:
    # Self-contained: a throwaway local Supabase stack, never the live
    # project. Own job so a slow/flaky local-stack boot never blocks the
    # fast hermetic suite above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" is resolved through the GitHub API, which rate-
          # limited this job red on c0b839f. Bump deliberately.
          version: 2.118.0
      - run: supabase start --exclude studio,edge-runtime,imgproxy,logflare,vector,pgbouncer
      - run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/schema.sql
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  test-e2e:
    # Against a throwaway local stack this job starts, never a hosted project:
    # global-setup provisions plans only on a loopback Supabase URL, and
    # nothing can delete a plan or vote from a hosted one.
    # WebKit / Mobile Safari are excluded on purpose: the prod build's HSTS +
    # upgrade-insecure-requests break WebKit on http://localhost. Don't relax
    # the headers; get WebKit coverage from an https preview (playwright.config.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SECURITY_CONTROL_SECRET: local-secret
      DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" is resolved through the GitHub API, which rate-
          # limited this job red on c0b839f. Bump deliberately.
          version: 2.118.0
      - run: supabase start --exclude studio,edge-runtime,imgproxy,logflare,vector,pgbouncer,postgres-meta
      - run: echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
      - run: |
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          # the quota RPCs fail closed without it (docs/SECURITY_SETUP.md)
          psql "$DB" -v ON_ERROR_STOP=1 -q -c "insert into app_control_secrets(name, secret_hash) values ('server-control', encode(extensions.digest('$SECURITY_CONTROL_SECRET', 'sha256'), 'hex'))"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project="Mobile Chrome" ${{ inputs.update_visual && '--update-snapshots' || '' }}
      - if: inputs.update_visual
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/e2e/visual.spec.ts-snapshots/
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
