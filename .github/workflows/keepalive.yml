name: Keep-alive

# The free Supabase tier pauses a project after a stretch of inactivity, and
# this one has paused before — which turns the public demo link into an error
# page. /api/health does one real database read, so a daily hit counts as
# activity. It also doubles as a daily uptime check: a non-200 fails the run
# and GitHub emails the repo owner. Scheduled workflows only run from the
# default branch.

on:
  schedule:
    - cron: "17 6 * * *" # 10:17 Dubai time
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl --fail --silent --show-error --max-time 20 --retry 2 https://plan-ind.vercel.app/api/health
